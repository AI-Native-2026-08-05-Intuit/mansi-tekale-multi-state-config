# argocd/applications/multistate-api-dev.yaml
# Single-env Application for the dev overlay. Task 3's ApplicationSet
# will later generate this same Application (plus staging/prod) via a
# matrix generator -- at that point this standalone file is deleted so
# the two don't race over ownership of multistate-api-dev.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multistate-api-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    env:  dev
    team: multistate
spec:
  project: multistate

  source:
    repoURL:        https://github.com/AI-Native-2026-08-05-Intuit/mansi-tekale-multi-state-config.git
    path:           overlays/dev
    targetRevision: main

  destination:
    server:    https://kubernetes.default.svc
    namespace: multistate-dev

  syncPolicy:
    automated:
      prune:      true
      selfHeal:   true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 3m
