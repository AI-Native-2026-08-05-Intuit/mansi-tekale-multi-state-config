# argocd-system/notifications-cm.yaml
# Wires argocd-notifications-controller to Slack via a generic webhook
# service (an Incoming Webhook URL, not a Bot Token) -- the cohort's
# shared Slack app only exposes an Incoming Webhook for
# #argocd-notifications, and Argo CD's `service.webhook` type posts
# arbitrary JSON to any URL, so it fits without provisioning a Bot
# Token. The URL is held in the argocd-notifications-secret (created
# out-of-band with kubectl create secret generic -- never committed to
# Git); this ConfigMap declares only the triggers, templates, and the
# named service that points at the secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # ----- Where to deliver notifications -----
  service.webhook: |
    slack:
      url: $slack-webhook-url
      headers:
        - name: Content-Type
          value: application/json

  # ----- Triggers (when to fire) -----
  trigger.on-sync-failed: |
    - description: Application sync failed.
      send:    [app-sync-failed]
      when:    app.status.operationState.phase in ['Error', 'Failed']

  trigger.on-health-degraded: |
    - description: Application health degraded.
      send:    [app-health-degraded]
      when:    app.status.health.status == 'Degraded'

  # NOTE: on-sync-succeeded is DELIBERATELY omitted. Subscribing every
  # Application to it produces a deploy-firehose that humans learn to
  # mute -- and once muted, they miss the failures too. Alert on bad
  # outcomes only; rely on Git history + the Argo CD UI for "what
  # deployed when."

  # ----- Templates (how to render) -----
  # The webhook service posts this body as-is to the Slack Incoming
  # Webhook URL, so `text` here is Slack's own top-level message field.
  template.app-sync-failed: |
    webhook:
      slack:
        method: POST
        body: |
          {
            "text": "*{{.app.metadata.name}}* sync FAILED at {{.app.status.operationState.finishedAt}}.\nProject: {{.app.spec.project}}\nRevision: {{.app.status.operationState.syncResult.revision}}\nPhase: {{.app.status.operationState.phase}}\nMessage: {{.app.status.operationState.message}}"
          }

  template.app-health-degraded: |
    webhook:
      slack:
        method: POST
        body: |
          {
            "text": "*{{.app.metadata.name}}* health is DEGRADED.\nProject: {{.app.spec.project}}\nStatus: {{.app.status.health.status}}\nMessage: {{.app.status.health.message}}"
          }

  # ----- Default subscriptions -----
  subscriptions: |
    - recipients: [webhook:slack]
      triggers:   [on-sync-failed, on-health-degraded]
      selector:   "team=multistate"
