# Dev-only placeholder -- never a real credential. Matches the
# POSTGRES_PASSWORD in manifests-dev-deps/postgres.yaml (this cluster's
# local dev Postgres, not part of the graded manifests/ tree). W6D3
# replaces this with a Secret populated by External Secrets Operator
# via IRSA against the platform-provided EKS cluster's OIDC provider.
apiVersion: v1
kind: Secret
metadata:
  name: multistate-api-secrets
  labels:
    app.kubernetes.io/name: multistate-api
type: Opaque
stringData:
  DB_PASSWORD: "devpass"
