# W6D5: the KEDA scale target. Same image as multistate-api, run in the
# `worker` Spring profile (web-application-type: none) -- consumes
# tenants.events, re-projects the Mongo read model, serves no HTTP.
# Starts at 0 replicas; KEDA owns the replica count from here (do NOT
# set spec.replicas and run a ScaledObject against this Deployment --
# that is a sync war).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multistate-api-worker
  labels:
    app.kubernetes.io/name: multistate-api-worker
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: multistate-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multistate-api-worker
        app.kubernetes.io/version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: worker
        image: uptimecrew/multistate-api:0.1.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: multistate-api-config
        - secretRef:
            name: multistate-api-secrets
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: worker
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
