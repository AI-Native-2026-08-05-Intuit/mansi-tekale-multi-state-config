apiVersion: v1
kind: ConfigMap
metadata:
  name: multistate-api-config
  labels:
    app.kubernetes.io/name: multistate-api
data:
  SPRING_PROFILES_ACTIVE: "dev"
  LOG_LEVEL: "DEBUG"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.multistate-dev.svc.cluster.local:5432/multistate"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATA_REDIS_HOST: "redis.multistate-dev.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.multistate-dev.svc.cluster.local:9092"
  SPRING_DATA_MONGODB_URI: "mongodb://mongodb.multistate-dev.svc.cluster.local:27017/multistate"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.multistate-dev.svc.cluster.local:4317"
