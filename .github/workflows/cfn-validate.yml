name: CFN Validate

on:
  pull_request:
    paths:
      - "cfn/**"
      - ".cfnlintrc.yaml"
      - ".cfn-nag-deny-list.yaml"
      - ".github/workflows/cfn-validate.yml"

permissions:
  id-token: write
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Run cfn-lint
        run: cfn-lint cfn/*.yaml

  cfn-nag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install cfn-nag
        run: |
          gem install --user-install cfn-nag
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Run cfn-nag
        run: cfn_nag_scan --input-path cfn/ --fail-on-warnings --deny-list-path .cfn-nag-deny-list.yaml

  validate-template:
    runs-on: ubuntu-latest
    needs: [cfn-lint, cfn-nag]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4.3.1
        with:
          role-to-assume: ${{ secrets.CFN_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: aws cloudformation validate-template
        run: |
          set -euo pipefail
          for f in cfn/*.yaml; do
            echo "Validating $f"
            aws cloudformation validate-template --template-body "file://$f"
          done
