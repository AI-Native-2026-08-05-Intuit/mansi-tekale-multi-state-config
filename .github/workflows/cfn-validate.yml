name: CFN Validate

on:
  pull_request:
    paths:
      - "cfn/**"
      - ".cfnlintrc.yaml"
      - ".github/workflows/cfn-validate.yml"

permissions:
  id-token: write
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Run cfn-lint
        run: cfn-lint cfn/*.yaml

  cfn-nag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cfn-nag
        run: |
          gem install cfn-nag

      - name: Run cfn-nag
        run: cfn_nag_scan --input-path cfn/ --fail-on-warnings

  validate-template:
    runs-on: ubuntu-latest
    needs: [cfn-lint, cfn-nag]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CFN_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: aws cloudformation validate-template
        run: |
          set -euo pipefail
          for f in cfn/*.yaml; do
            echo "Validating $f"
            aws cloudformation validate-template --template-body "file://$f"
          done
