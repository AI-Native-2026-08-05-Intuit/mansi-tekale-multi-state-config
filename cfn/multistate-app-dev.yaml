# TASK 3 application stack: an RDS PostgreSQL instance + a Secrets
# Manager secret holding the master credentials. Consumes the
# network stack's exports via !ImportValue -- never hardcode subnet
# or SG IDs, or the app stack silently drifts out of sync the next
# time the network stack is rebuilt. The DB master password is
# NEVER a NoEcho Parameter; it lives in Secrets Manager and is
# resolved at deploy time via the {{resolve:secretsmanager:...}}
# dynamic reference, so the password never appears in CFN state or
# in `describe-stacks` output. Stateful resources carry BOTH
# DeletionPolicy: Retain AND UpdateReplacePolicy: Retain.
#
# cfn-lint W3691 is suppressed below: the installed cfn-lint release's
# bundled RDS deprecated-version dataset flags every Postgres version it
# knows about (16.x through 17.3) as deprecated, which is stale relative
# to AWS's actual supported-version list. Tracked as a tooling-data-lag
# issue in INFRA.md, not a template defect.
AWSTemplateFormatVersion: "2010-09-09"
Description: multistate application stack -- RDS + Secrets Manager, consumes network exports.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment.
  NetworkStackName:
    Type: String
    Default: multistate-network-dev
    Description: Name of the network stack whose exports we !ImportValue.
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.small, db.t4g.medium, db.m6g.large]
    Description: RDS instance class.

Resources:
  # --- Secrets Manager secret: the DB master credentials.
  # GenerateSecretString means CFN never sees the password value,
  # only the secret's ARN -- anyone with cloudformation:DescribeStacks
  # cannot read the password out of stack state.
  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: multistate/dev/db-master
      Description: !Sub "multistate DB master credentials, ${EnvName}."
      KmsKeyId: alias/aws/secretsmanager
      GenerateSecretString:
        SecretStringTemplate: '{"username": "multistate_master"}'
        GenerateStringKey: password
        ExcludeCharacters: '"@/\'
        PasswordLength: 32
      Tags:
        - Key: Env
          Value: !Ref EnvName
        - Key: Project
          Value: multistate
        - Key: user
          Value: mansi-tekale
        - Key: env
          Value: sandbox

  # --- DB subnet group spanning the private subnets imported from
  # the network stack. !Split + !ImportValue is the cross-stack pattern.
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "multistate ${EnvName} private subnets"
      SubnetIds: !Split
        - ","
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-PrivateSubnets"
      Tags:
        - Key: Env
          Value: !Ref EnvName
        - Key: Project
          Value: multistate
        - Key: user
          Value: mansi-tekale
        - Key: env
          Value: sandbox

  # --- DB security group: ingress 5432 only from the app SG.
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "multistate ${EnvName} DB SG (5432 from app SG only)."
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "${NetworkStackName}-AppSgId"
          Description: Postgres from app SG only.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS egress only (no implicit allow-all).
      Tags:
        - Key: Name
          Value: !Sub "multistate-${EnvName}-db-sg"
        - Key: user
          Value: mansi-tekale
        - Key: env
          Value: sandbox

  # --- The RDS instance itself. Stateful: Retain on BOTH policies.
  # MasterUsername + MasterUserPassword resolve dynamically from
  # Secrets Manager; the password never appears in CFN template
  # parameters or stack outputs.
  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Engine: postgres
      EngineVersion: "17.3"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      MasterUsername: "{{resolve:secretsmanager:multistate/dev/db-master:SecretString:username}}"
      MasterUserPassword: "{{resolve:secretsmanager:multistate/dev/db-master:SecretString:password}}"
      Tags:
        - Key: Env
          Value: !Ref EnvName
        - Key: Project
          Value: multistate
        - Key: user
          Value: mansi-tekale
        - Key: env
          Value: sandbox
    DependsOn:
      - DbMasterSecret

  # --- Secret-to-DB attachment: rotation can target the live DB ARN.
  SecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbMasterSecret
      TargetId: !Ref DbInstance
      TargetType: AWS::RDS::DBInstance

Outputs:
  DbEndpoint:
    Value: !GetAtt DbInstance.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-DbEndpoint"
  DbSecretArn:
    Value: !Ref DbMasterSecret
    Export:
      Name: !Sub "${AWS::StackName}-DbSecretArn"
